
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cherry's Birthday Universe 🌸</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      font-family: Georgia, serif;
      color: white;
      background: radial-gradient(
        circle at top,
        #60345f,
        #251331 55%,
        #100c20
      );
    }

    .stars {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        radial-gradient(white 1px, transparent 1.5px),
        radial-gradient(#ffc5e5 1px, transparent 1.5px);
      background-size: 47px 47px, 73px 73px;
      background-position: 0 0, 20px 30px;
      animation: twinkle 4s ease-in-out infinite alternate;
    }

    @keyframes twinkle {
      from { opacity: .35; }
      to { opacity: 1; }
    }

    .screen {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      padding: 28px 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .invitation {
      width: 100%;
      max-width: 430px;
      padding: 35px 22px;
      border: 1px solid rgba(255, 208, 238, .65);
      border-radius: 28px;
      background: rgba(255, 255, 255, .07);
      box-shadow: 0 0 45px #ff78ce24;
      backdrop-filter: blur(8px);
      animation: float 4s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .flower {
      font-size: 40px;
      margin-bottom: 8px;
    }

    .eyebrow {
      color: #ffd2ee;
      letter-spacing: 4px;
      font-size: 11px;
      text-transform: uppercase;
    }

    h1 {
      color: #ffd1ed;
      font-size: clamp(35px, 10vw, 53px);
      margin: 18px 0 12px;
      text-shadow: 0 0 25px #ff80d3a0;
    }

    p {
      line-height: 1.8;
      color: #f8e5f5;
      font-size: 16px;
    }

    .button {
      display: inline-block;
      margin-top: 24px;
      padding: 15px 24px;
      border: 0;
      border-radius: 50px;
      background: linear-gradient(120deg, #ffaddb, #e9aaff);
      color: #351333;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 0 25px #ff9fdf55;
      animation: glow 2s infinite alternate;
    }

    @keyframes glow {
      to { box-shadow: 0 0 32px #ff9fdfaa; }
    }

    .hidden {
      display: none !important;
    }

    .party {
      position: fixed;
      inset: 0;
      z-index: 5;
      overflow: hidden;
      pointer-events: auto;
    }

    .confetti {
      position: absolute;
      top: -30px;
      animation: fall linear forwards;
    }

    @keyframes fall {
      to {
        transform: translateY(115vh) rotate(800deg);
      }
    }

    .party-message {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 90%;
      transform: translate(-50%, -50%);
      text-align: center;
      font-size: clamp(30px, 9vw, 55px);
      font-weight: bold;
      color: #ffe0f5;
      text-shadow: 0 0 30px #ff4cbe;
      animation: pop .7s ease-out both;
    }

    @keyframes pop {
      from {
        opacity: 0;
        scale: .3;
      }
      to {
        opacity: 1;
        scale: 1;
      }
    }

    .hint {
      font-size: 12px;
      color: #d9bbd8;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="stars"></div>

  <main class="screen">
    <section class="invitation" id="invitation">
      <div class="flower">🌸 🍒 🌸</div>
      <div class="eyebrow">A special invitation</div>

      <h1>Cherry's<br>Birthday</h1>

      <p>
        Dear Bhawani,<br>
        Your Litchi has planned a little
        universe just for you.
      </p>

      <p>
        A magical celebration awaits you,
        my Cherry. 💗
      </p>

      <button class="button" onclick="startParty()">
        Enter Your Birthday Universe ✨
      </button>

      <div class="hint">
        Made with love by your Litchi 🍒
      </div>
    </section>
  </main>

  <div class="party hidden" id="party"></div>

  
<script>
function startParty() {
  const party = document.getElementById("party");
  const invitation = document.getElementById("invitation");

  invitation.classList.add("hidden");
  party.classList.remove("hidden");
  party.innerHTML = "";

  const symbols = [
    "🎉", "🎊", "🎈", "💗", "🌸",
    "✨", "🍒", "💕", "🎈", "🎉"
  ];

  for (let i = 0; i < 140; i++) {
    const piece = document.createElement("div");
    piece.className = "confetti";
    piece.textContent =
      symbols[Math.floor(Math.random() * symbols.length)];
    piece.style.left = Math.random() * 100 + "%";
    piece.style.fontSize = (20 + Math.random() * 28) + "px";
    piece.style.animationDuration = (3 + Math.random() * 4) + "s";
    piece.style.animationDelay = Math.random() * 1.5 + "s";
    party.appendChild(piece);
  }

  const message = document.createElement("div");
  message.className = "party-message";
  message.innerHTML =
    "HAPPY BIRTHDAY<br>MY CHERRY! 🍒🌸<br>" +
    "<span style='font-size:24px'>YOUR MAGIC STARTS NOW!</span>";
  party.appendChild(message);

  setTimeout(() => {
    party.innerHTML = "";

    const cake = document.createElement("div");
    cake.style.cssText = `
      position:absolute; inset:0; overflow:auto;
      display:flex; align-items:center; justify-content:center;
      padding:20px; text-align:center;
      background:radial-gradient(circle,#713c75,#24112f 70%,#100c20);
    `;

    cake.innerHTML = `
      <div style="max-width:400px;padding:25px 15px">
        <div style="font-size:42px">🌸 🎂 🌸</div>
        <h1 style="color:#ffd1ed">A Cake for Cherry!</h1>
        <div style="font-size:65px">
  🧑🏻‍🍳 🎂 🧑🏻‍🍳
</div>
<div id="candles" style="font-size:28px">
  🕯️ 🕯️ 🕯️ 🕯️ 🕯️
</div>
        <p>Your special cake has arrived, Bhawani! 💗</p>
        <p>Close your eyes, make a wish, and blow your candles!</p>
        <button id="blow" style="
          padding:14px 22px;border:0;border-radius:30px;
          background:#ffaddb;color:#351333;font-weight:bold">
          Blow Your Candles! 🕯️
        </button>
        <div id="cheer" style="font-size:20px;margin-top:20px"></div>
      </div>
    `;

    party.appendChild(cake);

    

document.getElementById("blow").onclick = function() {
  document.getElementById("candles").innerHTML = "💨 ✨ 💨";

  document.getElementById("cheer").innerHTML =
    "🎂 Candles out! 💨<br><br>" +
    "👏🏻 👏🏻 👏🏻<br>" +
    "HAPPY BIRTHDAY, CHERRY! 🍒🌸<br>" +
    "Your Litchi is cheering the loudest! 💗<br><br>" +
    "<button onclick=\"showSpaceJourney()\" style=\"padding:14px 22px;border:0;border-radius:30px;background:#ffaddb;color:#351333;font-weight:bold;\">🚀 Begin Space Journey</button>";

  this.textContent = "Wish Granted! ✨";
  this.disabled = true;
};
```

**Important:** Do not delete the `}, 5500);` line! That line closes the timer for your cake scene, so it must remain in place. The replacement above ends the button handler only.

### Step 2 — Save and test

1. Tap **Commit changes…** and confirm.
2. Refresh your live website.
3. Reach the cake and tap **Blow Your Candles!**
4. Tap **🚀 Begin Space Journey**.

If GitHub shows an error or the button still doesn't work, send me a screenshot before making any more changes. We'll get Cherry's galaxy working! 🪐💗
}
  
function showSpaceJourney() {
  const party = document.getElementById("party");

  party.innerHTML = `
    <div style="
      position:fixed;
      inset:0;
      overflow:auto;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      text-align:center;
      padding:24px;
      color:white;
      background:radial-gradient(circle at top,#623a85,#21102f 70%);
      font-family:Georgia,serif;
    ">
      <h1 style="color:#ffb6e6;font-size:32px;">
        🌌 Cherry's Magical Galaxy 🌸
      </h1>

      <p style="font-size:17px;max-width:330px;">
        Welcome to your universe, Cherry! 💗
        Choose a planet to discover a little message from your Litchi.
      </p>

      <div style="font-size:55px;margin:12px;">
        <button onclick="planetMessage('Mercury')" style="background:none;border:0;font-size:45px;">🌑</button>
        <button onclick="planetMessage('Venus')" style="background:none;border:0;font-size:45px;">🪐</button>
        <button onclick="planetMessage('Earth')" style="background:none;border:0;font-size:45px;">🌍</button>
        <button onclick="planetMessage('Mars')" style="background:none;border:0;font-size:45px;">🔴</button>
        <button onclick="planetMessage('Jupiter')" style="background:none;border:0;font-size:45px;">🟠</button>
      </div>

      <div id="planet-note" style="
        margin:18px auto;
        padding:18px;
        max-width:320px;
        min-height:55px;
        border:1px solid #ffb6e6;
        border-radius:18px;
        background:#ffffff12;
        font-size:18px;
      ">
        ✨ Tap a planet to reveal your message! ✨
      </div>

      <p style="color:#ffc7e9;">Made with love by your Litchi 🍒</p>
    </div>
  `;
}

function planetMessage(planet) {
  const messages = {
    Mercury: "💌 Cherry, you make even little moments special!",
    Venus: "🌸 You deserve all the love and happiness in this universe.",
    Earth: "🌍 No matter how big the universe is, you'll always be special to your Litchi.",
    Mars: "❤️ Keep shining with your brave and beautiful heart!",
    Jupiter: "✨ May your dreams grow bigger than the biggest planet!"
  };

  document.getElementById("planet-note").textContent = messages[planet];
}

</script>

</body>
</html>
