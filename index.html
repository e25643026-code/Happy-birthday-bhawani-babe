
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cherry's Birthday Universe 🌸</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      font-family: Georgia, serif;
      color: white;
      background: radial-gradient(
        circle at top,
        #60345f,
        #251331 55%,
        #100c20
      );
    }

    .stars {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        radial-gradient(white 1px, transparent 1.5px),
        radial-gradient(#ffc5e5 1px, transparent 1.5px);
      background-size: 47px 47px, 73px 73px;
      background-position: 0 0, 20px 30px;
      animation: twinkle 4s ease-in-out infinite alternate;
    }

    @keyframes twinkle {
      from { opacity: .35; }
      to { opacity: 1; }
    }

    .screen {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      padding: 28px 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .invitation {
      width: 100%;
      max-width: 430px;
      padding: 35px 22px;
      border: 1px solid rgba(255, 208, 238, .65);
      border-radius: 28px;
      background: rgba(255, 255, 255, .07);
      box-shadow: 0 0 45px #ff78ce24;
      backdrop-filter: blur(8px);
      animation: float 4s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .flower {
      font-size: 40px;
      margin-bottom: 8px;
    }

    .eyebrow {
      color: #ffd2ee;
      letter-spacing: 4px;
      font-size: 11px;
      text-transform: uppercase;
    }

    h1 {
      color: #ffd1ed;
      font-size: clamp(35px, 10vw, 53px);
      margin: 18px 0 12px;
      text-shadow: 0 0 25px #ff80d3a0;
    }

    p {
      line-height: 1.8;
      color: #f8e5f5;
      font-size: 16px;
    }

    .button {
      display: inline-block;
      margin-top: 24px;
      padding: 15px 24px;
      border: 0;
      border-radius: 50px;
      background: linear-gradient(120deg, #ffaddb, #e9aaff);
      color: #351333;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 0 25px #ff9fdf55;
      animation: glow 2s infinite alternate;
    }

    @keyframes glow {
      to { box-shadow: 0 0 32px #ff9fdfaa; }
    }

    .hidden {
      display: none !important;
    }

    .party {
      position: fixed;
      inset: 0;
      z-index: 5;
      overflow: hidden;
      pointer-events: none;
    }

    .confetti {
      position: absolute;
      top: -30px;
      animation: fall linear forwards;
    }

    @keyframes fall {
      to {
        transform: translateY(115vh) rotate(800deg);
      }
    }

    .party-message {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 90%;
      transform: translate(-50%, -50%);
      text-align: center;
      font-size: clamp(30px, 9vw, 55px);
      font-weight: bold;
      color: #ffe0f5;
      text-shadow: 0 0 30px #ff4cbe;
      animation: pop .7s ease-out both;
    }

    @keyframes pop {
      from {
        opacity: 0;
        scale: .3;
      }
      to {
        opacity: 1;
        scale: 1;
      }
    }

    .hint {
      font-size: 12px;
      color: #d9bbd8;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="stars"></div>

  <main class="screen">
    <section class="invitation" id="invitation">
      <div class="flower">🌸 🍒 🌸</div>
      <div class="eyebrow">A special invitation</div>

      <h1>Cherry's<br>Birthday</h1>

      <p>
        Dear Bhawani,<br>
        Your Litchi has planned a little
        universe just for you.
      </p>

      <p>
        A magical celebration awaits you,
        my Cherry. 💗
      </p>

      <button class="button" onclick="startParty()">
        Enter Your Birthday Universe ✨
      </button>

      <div class="hint">
        Made with love by your Litchi 🍒
      </div>
    </section>
  </main>

  <div class="party hidden" id="party"></div>

  <script>
    function startParty() {
      const party = document.getElementById("party");
      const invitation = document.getElementById("invitation");

      invitation.classList.add("hidden");
      party.classList.remove("hidden");

      const symbols = [
        "🎉", "🎊", "🎈", "💗",
        "🌸", "✨", "🍒", "💕"
      ];

      for (let i = 0; i < 100; i++) {
        const piece = document.createElement("div");
        piece.className = "confetti";
        piece.textContent =
          symbols[Math.floor(Math.random() * symbols.length)];

        piece.style.left = Math.random() * 100 + "%";
        piece.style.fontSize = (18 + Math.random() * 25) + "px";
        piece.style.animationDuration = (2 + Math.random() * 4) + "s";
        piece.style.animationDelay = Math.random() * 2 + "s";

        party.appendChild(piece);
      }

      const message = document.createElement("div");
      message.className = "party-message";
      message.innerHTML =
        "HAPPY BIRTHDAY<br>MY CHERRY! 🍒🌸<br>🎂💗";

      party.appendChild(message);
    }
  </script>
</body>
</html>
